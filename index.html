<title>DTRS REC Coverage Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-bleed pannable network map; floating glass place-card (top-left on desktop, bottom sheet on phones); map controls float right. */
:root{
  --bg:#f2f2f4; --glass:rgba(255,255,255,.78); --glass-solid:#ffffff; --hair:rgba(60,60,67,.14); --fg:#1c1c1e; --muted:#6e6e73; --fill:rgba(118,118,128,.12);
  --rec:#ff3b30; --rec-fill:rgba(255,59,48,.22); --tx:#30c552; --blue:#007aff; --sb:#d633b8; --ac:#ff9500;
  --veil:rgba(242,242,244,.55); --shadow:0 10px 30px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.08);
  --mapfilter:none;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1c1f; --glass:rgba(30,30,32,.78); --glass-solid:#1c1c1e; --hair:rgba(255,255,255,.12); --fg:#f5f5f7; --muted:#a1a1a6; --fill:rgba(118,118,128,.24);
  --rec:#ff453a; --rec-fill:rgba(255,69,58,.26); --tx:#32d74b; --blue:#0a84ff; --sb:#ef5fd2; --ac:#ff9f0a;
  --veil:rgba(20,20,22,.55); --shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --mapfilter:invert(.9) hue-rotate(180deg) saturate(1.25) brightness(1.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1c1f; --glass:rgba(30,30,32,.78); --glass-solid:#1c1c1e; --hair:rgba(255,255,255,.12); --fg:#f5f5f7; --muted:#a1a1a6; --fill:rgba(118,118,128,.24);
  --rec:#ff453a; --rec-fill:rgba(255,69,58,.26); --tx:#32d74b; --blue:#0a84ff; --sb:#ef5fd2; --ac:#ff9f0a;
  --veil:rgba(20,20,22,.55); --shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --mapfilter:invert(.9) hue-rotate(180deg) saturate(1.25) brightness(1.05); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

#map{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--bg)}
#map.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:1480px;height:1040px;transform-origin:0 0;will-change:transform}
.world img{position:absolute;inset:0;width:1480px;height:1040px;user-select:none;-webkit-user-drag:none;filter:var(--mapfilter);pointer-events:none}
.world svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.pins{position:absolute;inset:0;pointer-events:none}

/* overlay drawing */
.veil{fill:var(--veil);transition:opacity .4s}
.rx-glow{fill:var(--rec);opacity:.35;filter:url(#blur)}
.rx{fill:var(--rec-fill);stroke:var(--rec);stroke-width:1.1;stroke-linejoin:round}
.tx-case{fill:none;stroke:#fff;stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
.tx{fill:none;stroke:var(--tx);stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round}
.tx-flow{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:2 7;opacity:.85}
@media (prefers-reduced-motion:no-preference){
  .tx-flow{animation:flow 1.1s linear infinite}
  .rx{animation:breathe 2.6s ease-in-out infinite}
}
@keyframes flow{to{stroke-dashoffset:-9}}
@keyframes breathe{50%{fill-opacity:.65}}
.hit{fill:transparent}
.lab{fill:var(--rec-fill);stroke:var(--rec);stroke-width:.8}
.lab.sel{fill:rgba(0,122,255,.18);stroke:var(--blue);stroke-width:1}

/* pins (screen space) */
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:auto;cursor:pointer}
.pin .head{min-width:34px;height:34px;padding:0 9px;border-radius:17px;background:var(--rec);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.02em;box-shadow:0 4px 12px rgba(0,0,0,.28);border:2px solid #fff;white-space:nowrap}
.pin .stem{width:3px;height:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.pin .foot{width:8px;height:8px;border-radius:50%;background:var(--rec);border:2px solid #fff;margin-top:-2px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.pin.station .head,.pin.station .foot{background:var(--blue)}
.pin.region .head,.pin.region .foot{background:var(--ac)}
.pin .ring{position:absolute;bottom:-6px;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;border:2px solid var(--rec);opacity:0}
.pin.station .ring{border-color:var(--blue)}
@media (prefers-reduced-motion:no-preference){.pin .ring{animation:ping 1.8s ease-out infinite}}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.pin.small .head{min-width:0;height:24px;padding:0 7px;font-size:11px;border-radius:12px}
.tag{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-size:11px;font-weight:600;padding:2px 7px;border-radius:9px;background:var(--glass-solid);color:var(--fg);box-shadow:0 2px 6px rgba(0,0,0,.18);white-space:nowrap;border:1px solid var(--hair)}
.tag.hl{background:var(--rec);color:#fff;border-color:transparent}
.sbm{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;pointer-events:none}
.sbm i{width:13px;height:13px;border-radius:4px;background:var(--sb);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.sbm span{font-size:10.5px;font-weight:700;font-family:var(--f-mono);background:var(--glass-solid);color:var(--sb);padding:1px 5px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.15)}

/* panel */
.panel{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(14px,env(safe-area-inset-left,0px));width:372px;max-height:calc(100% - 28px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.grab{display:none}
.sbar{display:flex;align-items:center;gap:8px;margin:12px 12px 8px;padding:0 10px;height:38px;border-radius:10px;background:var(--fill)}
.sbar svg{flex:none;color:var(--muted)}
.sbar input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:16px}
.sbar input::placeholder{color:var(--muted)}
.clr{border:0;background:var(--muted);color:var(--glass-solid);width:18px;height:18px;border-radius:50%;font-size:12px;line-height:18px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.body{overflow:auto;flex:1;min-height:0;padding:0 0 12px}
.seg{display:flex;gap:2px;margin:0 12px 6px;padding:2px;border-radius:9px;background:var(--fill)}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:5px 2px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--glass-solid);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sec{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;padding:12px 16px 4px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:8px 16px;cursor:pointer}
.row:hover{background:var(--fill)}
.row .ic{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-mono);font-size:9.5px;font-weight:700}
.ic.cell{background:var(--rec)} .ic.station{background:var(--blue)} .ic.sb{background:var(--sb)} .ic.ac{background:var(--ac)}
.row .tx2{min-width:0;flex:1}
.row .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row + .row{border-top:0}
.empty{padding:14px 16px;color:var(--muted)}

/* place card */
.card{padding:4px 16px 4px}
.card .kicker{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
.card h1{margin:2px 0 2px;font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.card .sub{color:var(--muted);font-size:14px}
.acts{display:flex;gap:8px;margin:12px 0 4px}
.acts button{flex:1;border:0;border-radius:10px;padding:9px 6px;background:var(--fill);color:var(--blue);font-weight:600;font-size:13.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.acts button svg{width:18px;height:18px}
.acts button.primary{background:var(--blue);color:#fff}
.box{margin:12px 0 0;background:var(--glass-solid);border-radius:12px;padding:10px 12px;border:1px solid var(--hair)}
.box h2{margin:0 0 7px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:7px}
.box h2 .k{width:12px;height:12px;border-radius:3px;flex:none}
.box h2 .n{margin-left:auto;font-family:var(--f-mono);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:0;border-radius:8px;padding:4px 8px;font-size:13px;background:var(--fill);color:var(--fg);cursor:pointer}
.chip:hover{background:var(--hair)}
.chip.hl{background:var(--rec);color:#fff}
.chip.cell{font-family:var(--f-mono);font-size:12px;font-weight:600}
.chip.static{cursor:default}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
.back{border:0;background:transparent;color:var(--blue);font-weight:600;font-size:14px;padding:0 0 4px;cursor:pointer;display:flex;align-items:center;gap:2px}

/* controls */
.ctrl{position:fixed;z-index:15;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;flex-direction:column;gap:10px}
.grp{display:flex;flex-direction:column;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.grp button{width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.grp button + button{border-top:1px solid var(--hair)}
.grp button:hover{background:var(--fill)}
.legend{position:fixed;z-index:15;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:6px 9px;align-items:center;max-width:260px}
.legend .s{width:22px;height:10px;border-radius:3px}
.legend b{grid-column:1/-1;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.attrib{position:fixed;z-index:14;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 6px);font-size:10.5px;color:var(--muted);background:var(--glass);padding:2px 8px;border-radius:8px;white-space:nowrap}

/* slide viewer */
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px))}
.modal .sheet{background:var(--glass-solid);border-radius:16px;box-shadow:var(--shadow);max-width:min(1100px,100%);max-height:100%;overflow:auto;padding:12px}
.modal .top{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;font-weight:600}
.modal img{display:block;width:100%;height:auto;border-radius:8px;background:#fff}
.modal button{border:0;background:var(--fill);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}

@media (max-width:700px){
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;border-radius:16px 16px 0 0;max-height:58%;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
  .panel.min{max-height:128px}
  .grab{display:block;width:36px;height:5px;border-radius:3px;background:var(--hair);margin:7px auto 0;border:0;padding:0;cursor:pointer}
  .legend{display:none}
  .ctrl{top:calc(env(safe-area-inset-top,0px) + 12px)}
  .attrib{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(12px,env(safe-area-inset-left,0px));transform:none}
}
</style>

<div id="map" aria-label="Victorian train network map with REC coverage">
  <div class="world" id="world">
    <img id="lo" src="net-lo.webp" alt="" width="1480" height="1040">
    <img id="hi" alt="" width="1480" height="1040">
    <svg id="ov" viewBox="0 0 1480 1040" width="1480" height="1040" aria-hidden="true">
      <defs>
        <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
        <mask id="cut"><rect width="1480" height="1040" fill="#fff"/><g id="cutg"></g></mask>
      </defs>
      <rect class="veil" id="veil" width="1480" height="1040" mask="url(#cut)" opacity="0"/>
      <g id="g-glow"></g><g id="g-rx"></g><g id="g-tx"></g>
    </svg>
  </div>
  <div class="pins" id="pins"></div>
</div>

<section class="panel" id="panel" aria-label="Search and details">
  <button class="grab" id="grab" aria-label="Expand or collapse panel"></button>
  <label class="sbar" for="q">
    <svg width="17" height="17" viewBox="0 0 17 17" fill="none" aria-hidden="true"><circle cx="7.3" cy="7.3" r="5.6" stroke="currentColor" stroke-width="1.9"/><path d="M11.6 11.6l3.6 3.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search a cell or station" autocomplete="off" spellcheck="false" aria-label="Search a cell or station">
    <button class="clr" id="clr" aria-label="Clear search" hidden>&times;</button>
  </label>
  <div class="body" id="body"></div>
</section>

<div class="ctrl">
  <div class="grp">
    <button id="zin" aria-label="Zoom in"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button id="zout" aria-label="Zoom out"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
  <div class="grp">
    <button id="fit" aria-label="Show whole network"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 6V2h4M12 2h4v4M16 12v4h-4M6 16H2v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="focus" aria-label="Zoom to selection"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M16 2L2 8.2l6 1.8 1.8 6z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
  </div>
</div>

<div class="legend" aria-label="Legend">
  <b>Legend</b>
  <span class="s" style="background:var(--rec-fill);border:1.5px solid var(--rec)"></span><span>REC Receive Area</span>
  <span class="s" style="background:var(--tx);border:2px solid #fff;box-shadow:0 0 0 1px var(--hair)"></span><span>REC Transmit Area (cell)</span>
  <span class="s" style="background:var(--rec);border-radius:6px"></span><span>Cell / station REC origin</span>
  <span class="s" style="background:var(--sb);width:13px;height:13px;border-radius:4px;justify-self:center"></span><span>Signal box that receives the REC</span>
</div>

for (const [code,pn] of Object.entries(D.sta)) E.push({id:'s-'+code,type:'station',code,name:N[code]||code,page:pn,line:(P[pn]||{}).group});
for (const [pn,pg] of Object.entries(P)) {
  if (pg.kind==='superbox') E.push({id:'b-'+pn,type:'sb',code:'SB',name:pg.title.replace(/ REC$/,''),page:+pn,line:pg.line});
  if (pg.kind==='region') E.push({id:'r-'+pn,type:'ac',code:'AC',name:pg.title,page:+pn,line:pg.roles.filter(r=>/Initiator/.test(r)).map(r=>r.replace(/ - Initiator/,'')).join(' + ')});
}
E.push({id:'r-6',type:'ac',code:'AC',name:'Inner AC areas',page:6,line:'Inner West + Inner East AC'});
const byId = Object.fromEntries(E.map(e=>[e.id,e]));
// which cells reach a station
const reach = {};
for (const e of E) if (e.type==='cell') for (const s of P[e.page].recvst) (reach[s] ||= []).push(e);

/* ---------- map transform ---------- */
const map=document.getElementById('map'), world=document.getElementById('world'), pins=document.getElementById('pins');
let s=1, tx=0, ty=0, anim=null;
const MAXS=7;
const minS=()=>Math.min(map.clientWidth/1480, map.clientHeight/1040)*0.85;
function apply(){ world.style.transform=`translate(${tx}px,${ty}px) scale(${s})`; placePins(); }
function clampS(v){ return Math.max(minS(), Math.min(MAXS, v)); }
function zoomAt(f, cx, cy){ const ns=clampS(s*f); const k=ns/s; tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; s=ns; apply(); }
function viewport(){ // area not covered by the panel
  const W=map.clientWidth,H=map.clientHeight, pr=panel.getBoundingClientRect();
  if (W<=700) return {x:0,y:0,w:W,h:Math.max(200,pr.top)};
  return {x:pr.right+10,y:0,w:W-pr.right-70,h:H};
}
function fitBox(b, animate=true){
  const v=viewport(), pad=46;
  const ns=clampS(Math.min((v.w-pad*2)/(b[2]-b[0]), (v.h-pad*2)/(b[3]-b[1]), 3.2));
  const ntx=v.x+v.w/2-ns*(b[0]+b[2])/2, nty=v.y+v.h/2-ns*(b[1]+b[3])/2;
  animate? flyTo(ns,ntx,nty) : (s=ns,tx=ntx,ty=nty,apply());
}
function flyTo(ns,ntx,nty){
  cancelAnimationFrame(anim);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce){ s=ns;tx=ntx;ty=nty;apply();return; }
  const s0=s,x0=tx,y0=ty,t0=performance.now(),dur=750;
  // interpolate in world-centre space for a smooth fly
  const W=map.clientWidth/2,H=map.clientHeight/2;
  const c0=[(W-x0)/s0,(H-y0)/s0], c1=[(W-ntx)/ns,(H-nty)/ns];
  const step=now=>{
    let t=Math.min(1,(now-t0)/dur); const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    s=Math.exp(Math.log(s0)+(Math.log(ns)-Math.log(s0))*e);
    const cx=c0[0]+(c1[0]-c0[0])*e, cy=c0[1]+(c1[1]-c0[1])*e;
    tx=W-cx*s; ty=H-cy*s; apply();
    if(t<1) anim=requestAnimationFrame(step);
  };
  anim=requestAnimationFrame(step);
}
// pointer pan / pinch
const pts=new Map(); let last=null, vel=[0,0], lastT=0, moved=0, pinch=null;
map.addEventListener('pointerdown',e=>{
  if(e.target.closest('.pin')) return;
  map.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]); cancelAnimationFrame(anim);
  moved=0; last=[e.clientX,e.clientY]; lastT=performance.now(); vel=[0,0];
  if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),c:[(a[0]+b[0])/2,(a[1]+b[1])/2]}; }
  map.classList.add('drag');
});
map.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2 && pinch){
    const [a,b]=[...pts.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); const c=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    tx+=c[0]-pinch.c[0]; ty+=c[1]-pinch.c[1]; zoomAt(d/pinch.d,c[0],c[1]); pinch={d,c}; moved+=10; return;
  }
  const now=performance.now(), dx=e.clientX-last[0], dy=e.clientY-last[1];
  tx+=dx; ty+=dy; moved+=Math.abs(dx)+Math.abs(dy); apply();
  const dt=Math.max(1,now-lastT); vel=[dx/dt*16,dy/dt*16]; last=[e.clientX,e.clientY]; lastT=now;
});
function up(e){
  if(!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId); if(pts.size<2) pinch=null;
  if(pts.size===0){
    map.classList.remove('drag');
    if(moved<5){ clickMap(e.clientX,e.clientY); return; }
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches && performance.now()-lastT<60){
      let v=[...vel]; const glide=()=>{ v=[v[0]*.92,v[1]*.92]; tx+=v[0]; ty+=v[1]; apply(); if(Math.hypot(...v)>.3) anim=requestAnimationFrame(glide); };
      anim=requestAnimationFrame(glide);
    }
  } else { const r=[...pts.values()][0]; last=r; }
}
map.addEventListener('pointerup',up); map.addEventListener('pointercancel',up);
map.addEventListener('wheel',e=>{ e.preventDefault(); cancelAnimationFrame(anim); const f=Math.exp(-e.deltaY*(e.ctrlKey?0.012:0.0022)); zoomAt(f,e.clientX,e.clientY); },{passive:false});
map.addEventListener('dblclick',e=>{ const ns=clampS(s*2), k=ns/s; flyTo(ns, e.clientX-(e.clientX-tx)*k, e.clientY-(e.clientY-ty)*k); });
document.getElementById('zin').onclick=()=>{ const ns=clampS(s*1.6),k=ns/s,cx=map.clientWidth/2,cy=map.clientHeight/2; flyTo(ns,cx-(cx-tx)*k,cy-(cy-ty)*k); };
document.getElementById('zout').onclick=()=>{ const ns=clampS(s/1.6),k=ns/s,cx=map.clientWidth/2,cy=map.clientHeight/2; flyTo(ns,cx-(cx-tx)*k,cy-(cy-ty)*k); };
document.getElementById('fit').onclick=()=>fitBox([150,0,1400,1000]);
document.getElementById('focus').onclick=()=>{ if(cur) fitBox(bounds(cur)); };
function clickMap(x,y){
  const wx=(x-tx)/s, wy=(y-ty)/s, pad=3;
  let hit=null, best=1e9;
  for(const [n,b] of Object.entries(LB)){
    if(wx>=b[0]-pad&&wx<=b[2]+pad&&wy>=b[1]-pad&&wy<=b[3]+pad){ const d=Math.hypot(wx-(b[0]+b[2])/2,wy-(b[1]+b[3])/2); if(d<best){best=d;hit=n;} }
  }
  if(hit){ const c=name2code[hit]; if(c && byId['s-'+c]) select(byId['s-'+c]); }
}

/* ---------- drawing ---------- */
const NS='http://www.w3.org/2000/svg';
const gGlow=document.getElementById('g-glow'), gRx=document.getElementById('g-rx'), gTx=document.getElementById('g-tx'), cutg=document.getElementById('cutg'), veil=document.getElementById('veil');
const ptsStr=a=>a.map(p=>p[0]+','+p[1]).join(' ');
function el(tag,attrs,parent){ const n=document.createElementNS(NS,tag); for(const k in attrs) n.setAttribute(k,attrs[k]); parent.appendChild(n); return n; }
let pinData=[], cur=null;
function centerOf(name){ const b=LB[name]; return b?[(b[0]+b[2])/2,(b[1]+b[3])/2]:null; }
function draw(e){
  [gGlow,gRx,gTx,cutg].forEach(g=>g.replaceChildren());
  pinData=[];
  if(!e){ veil.setAttribute('opacity','0'); placePins(); return; }
  const pg=P[e.page];
  for(const poly of pg.recv){
    el('polygon',{points:ptsStr(poly),class:'rx-glow'},gGlow);
    el('polygon',{points:ptsStr(poly),class:'rx'},gRx);
    el('polygon',{points:ptsStr(poly),fill:'#000',stroke:'#000','stroke-width':16,'stroke-linejoin':'round'},cutg);
  }
  const cells = e.type==='cell' ? [[e.code,pg.cells[e.code]]] : [];
  for(const [code,c] of cells){
    for(const l of c.tx){
      el('polyline',{points:ptsStr(l),class:'tx-case'},gTx); el('polyline',{points:ptsStr(l),class:'tx'},gTx); el('polyline',{points:ptsStr(l),class:'tx-flow'},gTx);
      el('polyline',{points:ptsStr(l),fill:'none',stroke:'#000','stroke-width':16,'stroke-linecap':'round'},cutg);
    }
    let at=c.dot;
    if(!at && c.tx.length){ const l=c.tx[0]; at=l[Math.floor(l.length/2)]; }
    if(!at) at=centroid(pg.recv);
    pinData.push({k:'pin',cls:'cell',label:code,at});
  }
  if(e.type==='station'){ const at=centerOf(e.name); if(at) pinData.push({k:'pin',cls:'station',label:e.code,at:[at[0],LB[e.name][1]]}); }
  if(e.type==='sb'||e.type==='ac'){ pinData.push({k:'pin',cls:'region small',label:e.type==='sb'?'SB':'AC',at:centroid(pg.recv)}); }
  // station tags for highlighted (dispatcher) stations
  for(const h of pg.hl){ const b=LB[h]; if(!b) continue; const sel=(e.type==='station'&&h===e.name);
    el('rect',{x:b[0]-2,y:b[1]-1.5,width:b[2]-b[0]+4,height:b[3]-b[1]+3,rx:3,class:sel?'lab sel':'lab'},gTx);
    el('rect',{x:b[0]-4,y:b[1]-3,width:b[2]-b[0]+8,height:b[3]-b[1]+6,rx:4,fill:'#000'},cutg); }
  if(e.type==='station' && !pg.hl.includes(e.name)){ const b=LB[e.name]; if(b) el('rect',{x:b[0]-2,y:b[1]-1.5,width:b[2]-b[0]+4,height:b[3]-b[1]+3,rx:3,class:'lab sel'},gTx); }
  for(const sb of pg.sbs){ if(sb.c) pinData.push({k:'sb',label:sb.label.replace(/ REC$/,''),at:sb.c}); }
  veil.setAttribute('opacity','1');
  placePins();
}
function centroid(polys){ let x=0,y=0,n=0; for(const p of polys) for(const q of p){x+=q[0];y+=q[1];n++;} return n?[x/n,y/n]:[740,520]; }
function bounds(e){
  const pg=P[e.page]; let b=[1e9,1e9,-1e9,-1e9];
  const add=q=>{b[0]=Math.min(b[0],q[0]);b[1]=Math.min(b[1],q[1]);b[2]=Math.max(b[2],q[0]);b[3]=Math.max(b[3],q[1]);};
  pg.recv.forEach(p=>p.forEach(add));
  if(e.type==='cell'){ const c=pg.cells[e.code]; c.tx.forEach(l=>l.forEach(add)); if(c.dot) add(c.dot); }
  if(e.type==='station'){ const bb=LB[e.name]; if(bb){add([bb[0],bb[1]]);add([bb[2],bb[3]]);} }
  if(b[0]>b[2]) b=[150,0,1400,1000];
  const w=b[2]-b[0], h=b[3]-b[1]; if(w<80){b[0]-=(80-w)/2;b[2]+=(80-w)/2;} if(h<80){b[1]-=(80-h)/2;b[3]+=(80-h)/2;}
  return b;
}
function placePins(){
  let h='';
  for(const p of pinData){
    const x=p.at[0]*s+tx, y=p.at[1]*s+ty;
    if(p.k==='pin') h+=`<div class="pin ${p.cls}" style="left:${x}px;top:${y}px" data-focus="1"><div class="head">${esc(p.label)}</div><div class="stem"></div><div class="foot"></div><div class="ring"></div></div>`;
    else if(p.k==='tag') h+=`<div class="tag ${p.cls}" style="left:${x}px;top:${y}px">${esc(p.label)}</div>`;
    else if(p.k==='sb') h+=`<div class="sbm" style="left:${x}px;top:${y}px"><i></i>${p.label?`<span>${esc(p.label)}</span>`:''}</div>`;
  }
  pins.innerHTML=h;
}
pins.addEventListener('click',e=>{ if(e.target.closest('[data-focus]') && cur) fitBox(bounds(cur)); });

/* ---------- panel ---------- */
const panel=document.getElementById('panel'), body=document.getElementById('body'), q=document.getElementById('q'), clr=document.getElementById('clr');
let tab='cell';
const TABS=[['cell','Cells'],['station','Stations'],['sb','Superbox'],['ac','AC']];
const icon=e=>`<span class="ic ${e.type}">${esc(e.type==='cell'?e.code.split('-')[0]:e.type==='station'?e.code:e.code)}</span>`;
function rowHTML(e){
  const sub = e.type==='cell' ? `Cell REC · ${e.line} line` : e.type==='station' ? `Dispatcher REC to station · ${e.code}` : e.type==='sb' ? `Outgoing Superbox REC · ${e.line}` : `Area Controller REC · ${e.line}`;
  const nm = e.type==='cell' ? `${e.code} <span style="font-weight:400;color:var(--muted)">${esc(e.name)}</span>` : esc(e.name);
  return `<button class="row" data-id="${e.id}">${icon(e)}<span class="tx2"><div class="t1">${nm}</div><div class="t2">${esc(sub)}</div></span></button>`;
}
function renderList(){
  const term=q.value.trim().toLowerCase();
  let h='';
  if(term){
    const m=E.filter(e=>e.code.toLowerCase().includes(term)||e.name.toLowerCase().includes(term))
      .sort((a,b)=>score(b,term)-score(a,term));
    if(!m.length) h=`<div class="empty">Nothing matches “${esc(q.value)}”. Try a station name or a code like SUY.</div>`;
    else { h+='<div class="sec">Results</div>'+m.slice(0,60).map(rowHTML).join(''); }
  } else {
    h+='<div class="seg" role="group">'+TABS.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${tab===k}">${l}</button>`).join('')+'</div>';
    let list=E.filter(e=>e.type===tab);
    if(tab==='station') list.sort((a,b)=>a.name.localeCompare(b.name));
    let g=null;
    for(const e of list){
      const grp = tab==='station' ? e.name[0] : tab==='cell' ? e.line : '';
      if(grp!==g && grp){ g=grp; h+=`<div class="sec">${esc(g)}</div>`; }
      h+=rowHTML(e);
    }
  }
  body.innerHTML=h;
}
function score(e,t){ const c=e.code.toLowerCase(), n=e.name.toLowerCase(); return (c===t?100:0)+(n===t?90:0)+(c.startsWith(t)?40:0)+(n.startsWith(t)?30:0)+(e.type==='cell'?5:0); }
function chipsFor(names, hl=[]){ return names.map(n=>`<button class="chip${hl.includes(n)?' hl':''}" data-st="${esc(n)}">${esc(n)}</button>`).join(''); }
function renderCard(e){
  const pg=P[e.page];
  let kicker, title, sub;
  if(e.type==='cell'){ kicker='Cell REC'; title=`${e.code} cell`; sub=`${e.name} · ${e.line} line`; }
  else if(e.type==='station'){ kicker='Dispatcher REC to station'; title=e.name; sub=`${e.code} · ${e.line||''}`; }
  else if(e.type==='sb'){ kicker='Outgoing Superbox REC'; title=e.name; sub=`${e.line} area`; }
  else { kicker='Area Controller REC'; title=e.name; sub=e.line; }
  const c = e.type==='cell'? pg.cells[e.code]:null;
  let h=`<div class="card"><button class="back" id="back"><svg width="10" height="16" viewBox="0 0 10 16"><path d="M8 2L2 8l6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg> Back</button>
  <div class="kicker">${kicker}</div><h1>${esc(title)}</h1><div class="sub">${esc(sub)}</div>
  <div class="acts"><button class="primary" id="zoomto"><svg viewBox="0 0 18 18" fill="none"><path d="M16 2L2 8.2l6 1.8 1.8 6z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>Zoom to area</button><button id="slide"><svg viewBox="0 0 18 18" fill="none"><rect x="2" y="3" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M5 11l3-3 2 2 3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Source slide ${e.page}</button></div>`;
  const what = e.type==='cell' ? 'A REC made from radios in this cell is received by radios in the red area.' :
               e.type==='station' ? `A REC sent from the Dispatcher Console to ${e.name} is received by radios in the red area.` :
               'A REC sent from the Dispatcher Console for this group is received by radios in the red area.';
  h+=`<div class="box"><h2><span class="k" style="background:var(--rec-fill);border:1.5px solid var(--rec)"></span>Receive area<span class="n">${pg.recvst.length} stations</span></h2><div class="chips">${chipsFor(pg.recvst,pg.hl)}</div><p class="note">${what} Station list is read from the map and is approximate near boundaries.</p></div>`;
  if(c){
    h+=`<div class="box"><h2><span class="k" style="background:var(--tx)"></span>Transmit area (this cell)</h2>${c.txst.length?`<div class="chips">${chipsFor(c.txst)}</div>`:`<div class="note" style="margin:0">Radios near the pin, between the stations shown.</div>`}</div>`;
    const others=Object.keys(pg.cells).filter(k=>k!==e.code);
    if(others.length) h+=`<div class="box"><h2>Same receive area also used by</h2><div class="chips">${others.map(k=>`<button class="chip cell" data-id="c-${k}">${k}</button>`).join('')}</div></div>`;
  }
  if(pg.hl.length && e.type!=='station') h+=`<div class="box"><h2><span class="k" style="background:var(--rec)"></span>Dispatcher REC to these stations uses this area</h2><div class="chips">${chipsFor(pg.hl,pg.hl)}</div></div>`;
  if(e.type==='station'){
    const r=(reach[e.name]||[]).filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i);
    h+=`<div class="box"><h2><span class="k" style="background:var(--rec)"></span>Cell RECs that reach ${esc(e.name)}<span class="n">${r.length}</span></h2>${r.length?`<div class="chips">${r.map(x=>`<button class="chip cell" data-id="${x.id}">${x.code}</button>`).join('')}</div>`:'<div class="note" style="margin:0">None found on the cell maps.</div>'}</div>`;
  }
  const sbn = pg.sbn && pg.sbn.length ? pg.sbn : pg.sbs.map(x=>x.label).filter(Boolean);
  if(sbn.length) h+=`<div class="box"><h2><span class="k" style="background:var(--sb)"></span>Signal boxes receiving</h2><div class="chips">${sbn.map(x=>`<span class="chip static">${esc(x)}</span>`).join('')}</div></div>`;
  if(pg.roles.length) h+=`<div class="box"><h2><span class="k" style="background:var(--ac);border-radius:50%"></span>Area Controller</h2><div class="chips">${pg.roles.map(x=>`<span class="chip static">${esc(x)}</span>`).join('')}</div></div>`;
  h+='</div>';
  body.innerHTML=h; body.scrollTop=0;
  document.getElementById('back').onclick=()=>{ select(null); };
  document.getElementById('zoomto').onclick=()=>fitBox(bounds(e));
  document.getElementById('slide').onclick=()=>openSlide(e.page);
}
function select(e, opts={}){
  cur=e; draw(e);
  if(e){ renderCard(e); panel.classList.remove('min'); fitBox(bounds(e), !opts.instant); try{history.replaceState(null,'','#'+e.id)}catch(_){} }
  else { renderList(); try{history.replaceState(null,'','#')}catch(_){} }
}
body.addEventListener('click',ev=>{
  const r=ev.target.closest('[data-id]'); if(r){ select(byId[r.dataset.id]); return; }
  const t=ev.target.closest('[data-tab]'); if(t){ tab=t.dataset.tab; renderList(); return; }
  const st=ev.target.closest('[data-st]'); if(st){ const c=name2code[st.dataset.st]; if(c&&byId['s-'+c]) select(byId['s-'+c]); }
});
q.addEventListener('input',()=>{ clr.hidden=!q.value; if(cur){ cur=null; draw(null);} renderList(); });
q.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ const f=body.querySelector('.row'); if(f) select(byId[f.dataset.id]); q.blur(); } if(ev.key==='Escape'){ q.value=''; clr.hidden=true; select(null);} });
q.addEventListener('focus',()=>panel.classList.remove('min'));
clr.onclick=ev=>{ ev.preventDefault(); q.value=''; clr.hidden=true; select(null); q.focus(); };
document.getElementById('grab').onclick=()=>panel.classList.toggle('min');
document.addEventListener('keydown',ev=>{ if(ev.key==='/' && document.activeElement!==q){ ev.preventDefault(); q.focus(); } });

/* slide modal */
function openSlide(p){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="sheet" role="dialog" aria-label="Source slide"><div class="top"><span>REC Areas manual · slide ${p}</span><button>Close</button></div><img src="maps/s${String(p).padStart(3,'0')}.webp" alt="Original REC area slide ${p}"></div>`;
  m.addEventListener('click',ev=>{ if(ev.target===m||ev.target.tagName==='BUTTON') m.remove(); });
  document.body.appendChild(m); m.querySelector('button').focus();
}

/* boot */
const hi=document.getElementById('hi'); hi.onload=()=>{document.getElementById('lo').style.visibility='hidden'};
setTimeout(()=>{hi.src='net-hi.webp'},50);
fitBox([150,0,1400,1000],false);
addEventListener('resize',()=>{ if(cur) fitBox(bounds(cur),false); else fitBox([150,0,1400,1000],false); });
const h0=(location.hash||'').slice(1);
if(byId[h0]) select(byId[h0],{instant:true}); else { renderList(); select(byId['c-SUY']||null,{instant:true}); }
</script>
